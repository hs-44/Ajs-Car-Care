<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | AJS Car Care</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10; --surface:#151A21; --surface-2:#1C222B; --border:rgba(255,255,255,0.1);
    --text:#F5F7FA; --text-muted:#9AA4B2; --accent:#E4202D; --accent-soft:rgba(228,32,45,0.14); --amber:#F2A93B;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:32px 20px 60px; }
  .wrap{ max-width:920px; margin:0 auto; }
  .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:14px; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; }
  .brand-mark{ width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg, var(--accent), #8C0F17); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:28px; margin:0 0 6px; }
  p.sub{ color:var(--text-muted); margin:0 0 30px; }
  .btn{ padding:10px 18px; border-radius:999px; font-weight:600; font-size:13.5px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; text-decoration:none; display:inline-block; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 24px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .card h3{ margin:0 0 6px; font-size:16px; }
  .meta{ font-size:13px; color:var(--text-muted); display:flex; gap:14px; flex-wrap:wrap; }
  .meta span{ font-family:'JetBrains Mono',monospace; background:var(--surface-2); padding:3px 9px; border-radius:999px; }
  .status{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:5px 12px; border-radius:999px; }
  .status-pending_payment{ background:rgba(242,169,59,0.15); color:var(--amber); }
  .status-confirmed{ background:rgba(228,32,45,0.15); color:var(--accent); }
  .status-completed{ background:rgba(52,211,153,0.15); color:#34D399; }
  .status-cancelled{ background:rgba(255,255,255,0.08); color:var(--text-muted); }
  .empty{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/index.html" class="brand"><span class="brand-mark">AJ</span><span>AJS Car Care</span></a>
    <div class="actions">
      <a href="/index.html" class="btn btn-ghost" style="border:1px solid var(--border);">Back to site</a>
      <button class="btn btn-ghost" id="logoutBtn" style="border:1px solid var(--border);">Log out</button>
    </div>
  </div>

  <h1 id="pageTitle">My Bookings</h1>
  <p class="sub">Track the status of every wash, polish, PPF or ceramic coating slot you've booked.</p>

  <div id="bookingsList"></div>
</div>

<script>
  const token = localStorage.getItem('ajs_token');
  const user = JSON.parse(localStorage.getItem('ajs_user') || 'null');

  if(!token || !user){
    window.location.href = '/login.html';
  }

  document.getElementById('pageTitle').textContent = 'Welcome, ' + (user ? user.name.split(' ')[0] : '');

  document.getElementById('logoutBtn').addEventListener('click', function(){
    localStorage.removeItem('ajs_token');
    localStorage.removeItem('ajs_user');
    window.location.href = '/index.html';
  });

  const STATUS_LABELS = {
    pending_payment: 'Payment Pending',
    confirmed: 'Confirmed',
    completed: 'Completed',
    cancelled: 'Cancelled',
  };

  async function loadBookings(){
    const list = document.getElementById('bookingsList');
    try {
      const res = await fetch('/api/bookings/mine', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Could not load bookings.');

      if(data.bookings.length === 0){
        list.innerHTML = '<div class="empty">No bookings yet. <a href="/index.html#services" style="color:var(--accent);">Book your first slot →</a></div>';
        return;
      }

      list.innerHTML = data.bookings.map(function(b){
        const dateLabel = new Date(b.booking_date + 'T00:00:00').toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
        const canCancel = b.status === 'pending_payment' || b.status === 'confirmed';
        const canDownload = b.status === 'confirmed' || b.status === 'completed';
        return (
          '<div class="card">' +
            '<div>' +
              '<h3>' + b.service_name + '</h3>' +
              '<div class="meta">' +
                '<span>' + b.car_model + '</span>' +
                '<span>' + dateLabel + '</span>' +
                '<span>' + b.time_slot + '</span>' +
                '<span>Ref: ' + b.booking_ref + '</span>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:12px;">' +
              '<span class="status status-' + b.status + '">' + STATUS_LABELS[b.status] + '</span>' +
              (canDownload ? '<a class="btn btn-ghost" style="border:1px solid var(--border);" href="/api/payments/' + b.id + '/receipt" target="_blank">Receipt</a>' : '') +
              (canCancel ? '<button class="btn btn-ghost" style="border:1px solid var(--border);" onclick="cancelBooking(' + b.id + ')">Cancel</button>' : '') +
            '</div>' +
          '</div>'
        );
      }).join('');
    } catch(err){
      list.innerHTML = '<div class="empty">' + err.message + '</div>';
    }
  }

  async function cancelBooking(id){
    if(!confirm('Cancel this booking?')) return;
    try {
      const res = await fetch('/api/bookings/' + id + '/cancel', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Could not cancel.');
      loadBookings();
    } catch(err){
      alert(err.message);
    }
  }

  loadBookings();
</script>
</body>
</html>
